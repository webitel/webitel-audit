version: v2

managed:
  enabled: true
  override:
    # `general` (Lookup) is generated next to the audit code, as webitel-kb does.
    - file_option: go_package
      value: github.com/webitel/webitel-audit/gen/go/audit/v1;auditv1
      path: general.proto

plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go/audit/v1
    opt: paths=source_relative
    include_imports: true

  - remote: buf.build/grpc/go
    out: gen/go/audit/v1
    opt: paths=source_relative

  # Generate Webitel Service APIs specification (such as objclass, method permission access, ...)
  - local: [ "go", "run", "github.com/webitel/webitel-go-kit/cmd/protoc-gen-go-webitel@v0.0.20" ]
    out: gen/go/audit/v1

inputs:
  - git_repo: "https://github.com/webitel/protos"
    branch: "main"
    subdir: audit
